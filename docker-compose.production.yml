# 生产环境：backend + frontend，数据库使用远程 RDS
# 启动：docker compose -f docker-compose.production.yml up -d --build
# 自动读取同目录下的 .env 文件
services:
  backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-docker.m.daocloud.io/library/golang:1.22-alpine}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.19}
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 将 stdout/stderr 同时写入宿主机 /logs/regr-backend.log（docker logs 仍可用）
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ./server 2>&1 | tee -a /logs/regr-backend.log"]
    volumes:
      - backend_cover_uploads:/app/uploads/life-agent-covers
      - /logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-guzhoudvd:Hu957843!@tcp(rm-bp176012tca6793kcoo.mysql.rds.aliyuncs.com:3306)/agent_marketplace?charset=utf8mb4&parseTime=True}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SESSION_COOKIE: ${SESSION_COOKIE:-agent_fiverr_session}
      SECURE_SESSION_COOKIE: ${SECURE_SESSION_COOKIE:-}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen-plus}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 访问 Google Gemini 等境外 LLM 时走宿主机代理（Clash 等），见 .env.production.example
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      LLM_ENABLE_WEB_SEARCH: ${LLM_ENABLE_WEB_SEARCH:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_TTS_URL: ${DASHSCOPE_TTS_URL:-}
      DASHSCOPE_TTS_MODEL: ${DASHSCOPE_TTS_MODEL:-}
      DASHSCOPE_TTS_VOICE: ${DASHSCOPE_TTS_VOICE:-}
      DASHSCOPE_TTS_LANGUAGE: ${DASHSCOPE_TTS_LANGUAGE:-}
      DASHSCOPE_VC_MODEL: ${DASHSCOPE_VC_MODEL:-}
      DASHSCOPE_VOICE_ENROLL_URL: ${DASHSCOPE_VOICE_ENROLL_URL:-}
      OPENAI_TTS_API_KEY: ${OPENAI_TTS_API_KEY:-}
      TTS_DEBUG: ${TTS_DEBUG:-}
      # 微信登录
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
      # 手机号登录
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      PHONE_CODE_TTL: ${PHONE_CODE_TTL:-5m}
      # 邮箱验证码登录、找回密码（需宿主机 .env 配置 SMTP_*）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
      # 聊天记录导入
      MAX_CHAT_IMPORT_MESSAGES: ${MAX_CHAT_IMPORT_MESSAGES:-100}
      LIFE_AGENT_UNLIMITED_CHAT: ${LIFE_AGENT_UNLIMITED_CHAT:-true}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BACKEND_URL: http://backend:8080
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_LOGIN_SHOW_WECHAT: ${NEXT_PUBLIC_LOGIN_SHOW_WECHAT:-false}
        NEXT_PUBLIC_LOGIN_SHOW_PHONE: ${NEXT_PUBLIC_LOGIN_SHOW_PHONE:-false}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 将 stdout/stderr 同时写入宿主机 /logs/regr-frontend.log
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec node server.js 2>&1 | tee -a /logs/regr-frontend.log"]
    volumes:
      - /logs:/logs
    environment:
      API_BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
    depends_on:
      - backend

volumes:
  backend_cover_uploads:
