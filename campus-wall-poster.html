<html lang="zh-CN">
<head>
<meta charset="utf-8" />

<title>校园墙海报 · 过来人 AI</title>
<style>
  :root{
    --paper:#fbf3e8; --paper2:#f4e7d6; --ink:#2a2017; --ink2:#6b5d4a;
    --amber:#bd7d1b; --amber2:#d99a2b; --soft:#f6ecd6; --line:rgba(120,90,40,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#cdc6ba;display:flex;justify-content:center;padding:24px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  .poster{position:relative;width:720px;height:1440px;background:radial-gradient(120% 80% at 50% -10%, #fdf7ee 0%, var(--paper) 44%, var(--paper2) 100%);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28);padding:60px 58px 52px}
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(60,42,20,.05) 1px,transparent 1px);background-size:5px 5px;opacity:.5;pointer-events:none}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:18px;letter-spacing:.32em;color:var(--amber);font-weight:700;text-transform:uppercase}
  .eyebrow::before{content:"";width:30px;height:2px;background:var(--amber)}
  h1{margin-top:26px;font-family:"Songti SC","SimSun",serif;font-weight:800;font-size:60px;line-height:1.22;letter-spacing:1px}
  h1 .hl{background:linear-gradient(120deg,#7a4a1e 0%,#b87a2e 28%,#d9a52b 56%,#efc55c 88%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .sub{margin-top:22px;font-size:24px;line-height:1.7;color:var(--ink2)}
  .sub b{color:var(--amber);font-weight:700}
  .qs{margin-top:30px;display:flex;flex-direction:column;gap:13px}
  .q{display:flex;align-items:center;gap:18px;padding:13px 22px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px}
  .q .mk{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--soft);color:var(--amber);font-size:26px;font-weight:800;font-family:Georgia,serif}
  .q .qt{font-size:26px;font-weight:700;line-height:1.3;padding-left:18px;border-left:2px solid rgba(189,125,27,.3)}
  .q.feat{background:linear-gradient(100deg,#f8e8c5,#f3dcae);border-color:rgba(189,125,27,.5)}
  .q.feat .mk{background:#3a2c19;color:#f8ecd2}
  .q.feat .qt{border-left-color:rgba(189,125,27,.55)}
  .punch{margin-top:30px;font-size:24px;line-height:1.6;font-weight:700}
  .punch b{color:var(--amber)}
  .prow{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;margin-top:10px}
  .prow .ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--amber2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .cta{position:absolute;left:58px;right:58px;bottom:46px;padding-top:24px;border-top:1.5px dashed var(--line)}
  .cta-head{text-align:center;font-family:"Songti SC","SimSun",serif;font-size:32px;font-weight:800}
  .cta-head .spark{color:var(--amber2);margin-right:8px;font-family:-apple-system,sans-serif}
  .soon{display:inline-block;margin-left:12px;font-family:-apple-system,"PingFang SC",sans-serif;font-size:18px;font-weight:700;color:#9a6a12;background:rgba(217,154,43,.16);border:1px solid rgba(217,154,43,.4);border-radius:999px;padding:5px 16px;vertical-align:middle}
  .qr-row{margin-top:26px;display:flex;gap:30px;justify-content:center}
  .qr-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px}
  .qr{width:200px;height:200px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:12px}
  .qr img,.qr svg{width:100%;height:100%;display:block;object-fit:contain}
  .qr-label{text-align:center;font-size:23px;font-weight:700;letter-spacing:.05em}
  @page{size:720px 1440px;margin:0}
  @media print{body{background:#fff;padding:0;display:block}.poster{box-shadow:none;border-radius:0;margin:0;width:720px;height:1440px}}
</style>
</head>
